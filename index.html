<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PyVista Hover Zoom Example</title>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 40px auto;
    }

    .viz-wrapper {
      position: relative;
      height: 500px;
      margin: 40px 0;
    }

    .viz-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      pointer-events: none; /* key line */
    }

    .viz-wrapper:hover iframe {
      pointer-events: auto; /* enable interaction on hover */
    }

    .hint {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #555;
      pointer-events: none;
    }

    .viz-wrapper:hover .hint {
      display: none;
    }
  </style>
</head>
<body>

  <h1>PyVista embedded scene</h1>

  <p>
    Scroll down this page normally.  
    When you hover over the 3D view, mouse-wheel zoom becomes active.
  </p>

  <div class="viz-wrapper">
    <iframe src="html\pcr_visualisation.html"></iframe>
    <div class="hint"></div>
  </div>

  <p>
    Lorem ipsum dolor sit amet, consectetur adipiscing elit.
    Scroll continues to work once you leave the visual.
  </p>

  <p style="height: 800px">
    Extra space to demonstrate scrolling.
  </p>

</body>
</html>
